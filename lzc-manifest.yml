# Anchor - 离线优先的自托管笔记应用
# Offline first, self hostable note taking application

name: Anchor
package: community.lazycat.app.anchor
version: 0.3.1
min_os_version: 1.3.8

description: "Offline first, self hostable note taking application"
license: AGPL-3.0
homepage: https://github.com/ZhFahim/anchor
author: zhfahim

application:
  subdomain: anchor
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://anchor:3000/

services:
  anchor:
    # ghcr.io/zhfahim/anchor:0.3.1
    image: registry.lazycat.cloud/czyt/zhfahim/anchor:c9f956e5dafc81f7
    binds:
      - /lzcapp/var/data:/data
    cpu_shares: 512
    mem_limit: 512M

locales:
  en:
    name: "Anchor"
    description: "Offline first, self hostable note taking application"
  zh:
    name: "Anchor"
    description: "离线优先的自托管笔记应用"
